---
dependencies:
  # get podman from debian testing, since the version in
  # debian 12 bookworm does not support Quadlets, yet
  - role: systemli.apt_repositories
    vars:
      apt_repositories:
        - filename: deb.debian.org-testing
          url: "http://deb.debian.org/debian"
          suites: testing
          key_path: debian-archive-key-12.asc
          packages:
            - podman
            - crun
            - passt
